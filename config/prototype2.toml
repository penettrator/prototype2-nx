# B-001 (city crash): the first stream-arena failure is written to logs/rex/p2_arena_failure.bin; a full arena part
# gets an overflow block from its own guest heap instead of a null result.
p2_stream_arena_trace = true
p2_stream_arena_overflow = true
p2_stream_arena_overflow_cap_mb = 96

# Performance (0.3.0): texture memory pool, ring read pointer write-back, WAIT_REG_MEM poll sleep.
p2_native_texture_pool = true
p2_native_rptr_writeback_words = 64
p2_native_wait_reg_mem_sleep_us = 10

# Performance (0.3.0): lock-free interrupt-region sets for the hottest job-system functions.
p2_msr_hot2_lockfree = true
p2_msr_hot3_lockfree = true
p2_msr_hot3_ab_period_s = 0
p2_msr_hot4_lockfree = true
p2_msr_hot4_ab_period_s = 0
p2_wait_histogram = false

# Performance (0.3.0): second skinning helper on core 2.
p2_skinning_helpers = 2
p2_skinning_helper2_mask = 4
p2_skinning_helper2_priority = 42
p2_skinning_multi_ab_period_s = 0

# Performance (0.3.0): the SDK semaphore skips a wake when nobody waits.
p2_semaphore_skip_empty_wake = 1

# Green flash before videos: the video planes are created at once.
p2_native_sync_video_planes = true

# Sun/moon glow through bridges and buildings: an occlusion query result that is not ready yet repeats the last
# measured result (the game reads "not ready" as visible).
p2_occlusion_provisional = true
p2_occlusion_fallback_last = true
p2_occlusion_fake_last = true
p2_occlusion_report = false
p2_sun_probe_flip = false
